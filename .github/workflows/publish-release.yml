name: Publish BattleMender release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching an existing v-prefixed Git tag and TOC
        required: true
        type: string
      archive_sha256:
        description: SHA256 of the locally verified release ZIP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: battlemender-publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA256: ${{ inputs.archive_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Build and verify archive
        run: |
          python3 .github/scripts/build_release.py --version "$RELEASE_VERSION" --output release-output
          python3 - <<'PY'
          import hashlib, os, pathlib
          version = os.environ['RELEASE_VERSION']
          archive = pathlib.Path('release-output') / f'BattleMender-v{version}.zip'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != os.environ['EXPECTED_SHA256'].lower():
              raise SystemExit('Archive differs from the locally verified ZIP; publication stopped.')
          print('Archive matches the locally verified SHA256.')
          PY
      - name: Validate CurseForge access and game version
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 .github/scripts/curseforge_upload.py preflight --version "$RELEASE_VERSION"
      - name: Create GitHub release draft with verified files
        run: |
          gh release create "v$RELEASE_VERSION" --verify-tag --draft --title "BattleMender $RELEASE_VERSION" --notes-file release-output/release-notes.md "release-output/BattleMender-v$RELEASE_VERSION.zip" "release-output/BattleMender-v$RELEASE_VERSION.zip.sha256" release-output/manifest.txt
      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 .github/scripts/curseforge_upload.py upload --version "$RELEASE_VERSION"
      - name: Publish GitHub release
        run: |
          gh release upload "v$RELEASE_VERSION" release-output/curseforge-result.json
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
